<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Teclado hexagonal interactivo para música microtonal en temperamento 31-TET">
  <meta name="keywords" content="música microtonal, 31-TET, teclado hexagonal, Max/MSP">
  <meta name="author" content="Tu Nombre">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Teclado Microtonal 31-TET</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="header">
    <h1>Teclado Microtonal 31-TET</h1>
    <p>Sistema de temperamento igual de 31 notas por octava</p>
  </div>

  <div class="controls">
    <div class="control-group">
      <button id="octave-down">-8va</button>
      <button id="reset-octave">Reset Octava</button>
      <button id="octave-up">+8va</button>
    </div>

    <div class="control-group">
      <label for="scale-selector">Escala:</label>
      <select id="scale-selector">
        <option value="none">Ninguna</option>
        <optgroup label="Modos Griegos">
          <option value="ionian">Jónico (Mayor)</option>
          <option value="dorian">Dórico</option>
          <option value="phrygian">Frigio</option>
          <option value="lydian">Lidio</option>
          <option value="mixolydian">Mixolidio</option>
          <option value="aeolian">Eólico (Menor)</option>
          <option value="locrian">Locrio</option>
        </optgroup>
        <optgroup label="Escalas Especiales">
          <option value="chromatic">Cromática (31 notas)</option>
          <option value="wholeTone">Tonos Enteros</option>
          <option value="pentatonicMajor">Pentatónica Mayor</option>
          <option value="pentatonicMinor">Pentatónica Menor</option>
          <option value="blues">Blues</option>
          <option value="harmonicMinor">Armónica Menor</option>
        </optgroup>
      </select>
    </div>

    <div class="control-group">
      <label>
        <input type="checkbox" id="combine-scales">
        Combinar escalas
      </label>
      <button id="clear-scales" style="background: #e74c3c;">Limpiar escalas</button>
      <button id="theme-toggle" aria-label="Cambiar tema">Modo: Oscuro</button>
    </div>
  </div>

  <div class="scale-combination" id="scale-combination" style="display: none;">
    <h4>Escalas combinadas:</h4>
    <div id="combined-scales-list"></div>
  </div>

  <div class="info-panel">
    <h3>Información en tiempo real</h3>

    <!-- Modo Monofonía -->
    <div class="info-section">
      <h4>Última nota tocada</h4>
      <div class="info-item">
        <strong>Nota:</strong> <span id="current-note">-</span>
      </div>
      <div class="info-item">
        <strong>Frecuencia:</strong> <span id="current-freq">-</span> Hz
      </div>
      <div class="info-item">
        <strong>Octava:</strong> <span id="current-octave">0</span>
      </div>
    </div>

    <!-- Modo Polifonía -->
    <div class="info-section polyphony-section">
      <h4>Polifonía Activa <span id="poly-count" class="poly-counter">0</span></h4>
      <div id="active-notes-container" class="active-notes-grid">
        <span class="no-notes-message">No hay notas activas</span>
      </div>
    </div>
  </div>

  <div class="keyboard-wrapper">
    <div class="keyboard-container" id="keyboard-container"></div>
  </div>

  <!-- Scripts originales -->
  <script src="js/config.js"></script>
  <script src="js/scales.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>

  <!-- ✅ CLIENTE WEBSOCKET-OSC COMPLETO PARA MAX MSP -->
  <script>
    // Cliente WebSocket completo para teclados microtonales
    class MicrotonalOSCBridge {
      constructor() {
        this.ws = null;
        this.isConnected = false;
        this.tetSystem = this.detectTETSystem();
        this.init();
      }

      detectTETSystem() {
        const title = document.title;
        const tetMatch = title.match(/(\d+)-TET/);
        return tetMatch ? `${tetMatch[1]}-TET` : '31-TET';
      }

      init() {
        this.connect();
        this.interceptFunctions();
      }

      connect() {
        try {
          console.log('Conectando a ws://localhost:8080...');
          this.ws = new WebSocket('ws://localhost:8080');

          this.ws.onopen = () => {
            console.log('WebSocket conectado a Max MSP');
            this.isConnected = true;
            this.showStatus(true);
          };

          this.ws.onclose = () => {
            console.log('WebSocket desconectado');
            this.isConnected = false;
            this.showStatus(false);
          };

          this.ws.onerror = (error) => {
            console.error('Error WebSocket:', error);
            this.isConnected = false;
            this.showStatus(false);
          };
        } catch (error) {
          console.error('Error creando WebSocket:', error);
        }
      }

      send(message) {
        if (this.isConnected && this.ws) {
          try {
            this.ws.send(JSON.stringify(message));
            return true;
          } catch (error) {
            console.error('Error enviando mensaje:', error);
            return false;
          }
        }
        return false;
      }

      sendNoteOn(noteId, frequency, velocity, noteName, octave = 0) {
        return this.send({
          type: 'note_on',
          noteId: noteId,
          frequency: frequency,
          velocity: velocity,
          noteName: noteName,
          octave: octave,
          tetSystem: this.tetSystem,
          timestamp: Date.now()
        });
      }

      sendNoteOff(noteId, frequency, noteName) {
        return this.send({
          type: 'note_off',
          noteId: noteId,
          frequency: frequency,
          velocity: 0,
          noteName: noteName,
          tetSystem: this.tetSystem,
          timestamp: Date.now()
        });
      }

      // ✅ FUNCIÓN QUE FALTABA: sendPolyphonyUpdate
      sendPolyphonyUpdate(activeNotes) {
        const frequencies = activeNotes.map(note => note.frequency);
        const noteIds = activeNotes.map(note => note.id);

        return this.send({
          type: 'polyphony_update',
          activeNotesCount: activeNotes.length,
          activeFrequencies: frequencies,
          activeNoteIds: noteIds,
          activeNotes: activeNotes,
          tetSystem: this.tetSystem,
          timestamp: Date.now()
        });
      }

      // ✅ Función para cambios de escala
      sendScaleChange(scaleName, scaleNotes = []) {
        return this.send({
          type: 'scale_change',
          scaleName: scaleName,
          scaleNotes: scaleNotes,
          scaleLength: scaleNotes.length,
          tetSystem: this.tetSystem,
          timestamp: Date.now()
        });
      }

      // ✅ Función para cambios de octava
      sendOctaveChange(octaveShift) {
        return this.send({
          type: 'octave_change',
          octaveShift: octaveShift,
          tetSystem: this.tetSystem,
          timestamp: Date.now()
        });
      }

      interceptFunctions() {
        // Esperar a que se carguen las funciones del teclado
        const checkFunctions = () => {
          if (typeof window.playNote === 'function') {
            console.log('Interceptando funciones del teclado...');
            this.overridePlayNote();
            this.overrideStopNote();
          } else {
            setTimeout(checkFunctions, 100);
          }
        };
        checkFunctions();
      }

      overridePlayNote() {
        const originalPlayNote = window.playNote;
        const bridge = this;

        window.playNote = function (config) {
          // Llamar función original
          const result = originalPlayNote.call(this, config);

          // Enviar a Max MSP
          if (bridge.isConnected) {
            const frequency = getFrequency ? getFrequency(config.value) : 440;
            console.log(`Enviando NOTE_ON: ${config.name} (${frequency?.toFixed(2)}Hz)`);

            bridge.sendNoteOn(
              config.value,
              frequency,
              127,
              config.name,
              currentOctave || 0
            );
          } else {
            console.warn('WebSocket no conectado');
          }

          return result;
        };
      }

      overrideStopNote() {
        const originalStopNote = window.stopNote;
        const bridge = this;

        window.stopNote = function (config) {
          // Llamar función original
          const result = originalStopNote.call(this, config);

          // Enviar a Max MSP
          if (bridge.isConnected) {
            const frequency = getFrequency ? getFrequency(config.value) : 440;
            console.log(`Enviando NOTE_OFF: ${config.name} (${frequency?.toFixed(2)}Hz)`);

            bridge.sendNoteOff(
              config.value,
              frequency,
              config.name
            );
          }

          return result;
        };
      }

      showStatus(connected) {
        let statusElement = document.getElementById('websocket-status');

        if (!statusElement) {
          statusElement = document.createElement('div');
          statusElement.id = 'websocket-status';
          statusElement.style.cssText = `
          position: fixed;
          top: 10px;
          right: 10px;
          padding: 8px 12px;
          border-radius: 4px;
          font-family: Arial, sans-serif;
          font-size: 12px;
          font-weight: bold;
          z-index: 1000;
          color: white;
        `;
          document.body.appendChild(statusElement);
        }

        if (connected) {
          statusElement.textContent = 'Max MSP Conectado';
          statusElement.style.backgroundColor = '#2ecc71';
        } else {
          statusElement.textContent = 'Max MSP Desconectado';
          statusElement.style.backgroundColor = '#e74c3c';
        }
      }
    }

    // Inicializar cuando se carga la página
    document.addEventListener('DOMContentLoaded', function () {
      console.log('Iniciando puente WebSocket-OSC...');
      window.microtonalBridge = new MicrotonalOSCBridge();

      // Interceptar controles de octava
      const interceptOctaveControls = () => {
        const octaveUp = document.getElementById('octave-up');
        const octaveDown = document.getElementById('octave-down');
        const octaveReset = document.getElementById('reset-octave');

        if (octaveUp && !octaveUp.hasAttribute('data-intercepted')) {
          octaveUp.setAttribute('data-intercepted', 'true');
          octaveUp.addEventListener('click', () => {
            setTimeout(() => {
              if (window.microtonalBridge && window.microtonalBridge.isConnected) {
                window.microtonalBridge.sendOctaveChange(currentOctave || 0);
              }
            }, 50);
          });
        }

        if (octaveDown && !octaveDown.hasAttribute('data-intercepted')) {
          octaveDown.setAttribute('data-intercepted', 'true');
          octaveDown.addEventListener('click', () => {
            setTimeout(() => {
              if (window.microtonalBridge && window.microtonalBridge.isConnected) {
                window.microtonalBridge.sendOctaveChange(currentOctave || 0);
              }
            }, 50);
          });
        }

        if (octaveReset && !octaveReset.hasAttribute('data-intercepted')) {
          octaveReset.setAttribute('data-intercepted', 'true');
          octaveReset.addEventListener('click', () => {
            setTimeout(() => {
              if (window.microtonalBridge && window.microtonalBridge.isConnected) {
                window.microtonalBridge.sendOctaveChange(0);
              }
            }, 50);
          });
        }

        // Interceptar cambios de escala
        const scaleSelector = document.getElementById('scale-selector');
        if (scaleSelector && !scaleSelector.hasAttribute('data-intercepted')) {
          scaleSelector.setAttribute('data-intercepted', 'true');
          scaleSelector.addEventListener('change', (e) => {
            setTimeout(() => {
              if (window.microtonalBridge && window.microtonalBridge.isConnected) {
                window.microtonalBridge.sendScaleChange(e.target.value);
              }
            }, 50);
          });
        }
      };

      // Intentar interceptar cada 500ms hasta que los elementos estén disponibles
      const intervalId = setInterval(() => {
        if (document.getElementById('octave-up')) {
          interceptOctaveControls();
          clearInterval(intervalId);
        }
      }, 500);
    });
  </script>

</body>

</html>
